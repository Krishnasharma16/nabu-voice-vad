services:
  - type: web
    name: nabu-voice-vad
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run download-model
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: models/gemini-3.1-flash-live-preview
